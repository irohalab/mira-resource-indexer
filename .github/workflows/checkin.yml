name: lint-and-unit-test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-job:
    # MongoDB 8 cannot start on kernels 6.19 through 7.0.13 (SERVER-121912).
    runs-on: ubuntu-22.04
    env:
      INDEXER_MODE: dmhy
      DB_HOST: 127.0.0.1
      DB_PORT: 27017
      DB_USER: admin
      DB_NAME: test_indexer
      DB_PASS: 123456
      AUTH_SOURCE: admin
    # if: contains(github.event.pull_request.labels.*.name, 'Ready To Test')
    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci
    - name: Test code format
      run: npm run lint

    - name: prepare docker
      uses: hoverkraft-tech/compose-action@v2.0.2
      with:
        compose-file: ./docker-compose.yml
        up-flags: --wait --wait-timeout 120
        services: |
          mongo
          rabbitmq
        
    - name: Unit test and code covergae
      run: |
        export AMQP_URL=amqp://ciuser:cipassword@localhost:5672/
        npm run check-coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{secrets.CODECOV_TOKEN}}
